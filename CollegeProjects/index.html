<script>
    function openSubjectContainer(subjectID){

        // Hide all work containers
        document.querySelectorAll(".work-container")
            .forEach(c => c.classList.remove("active"));

        // If a specific container was requested, show it
        if(subjectID !== ""){
            document.getElementById(subjectID)
                .classList.add("active");
        }
    }
</script>
